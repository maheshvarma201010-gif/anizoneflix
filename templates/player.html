{% extends "base.html" %}

{% block content %}
<div class="max-w-7xl mx-auto px-4 py-8">
    <div class="glass rounded-[2.5rem] overflow-hidden shadow-2xl animate-fade-in mb-8">
        <div class="p-4 md:p-8">
            <div class="flex items-center gap-4 mb-6">
                <a href="/anime/{{ episode.mal_id|slugify }}" class="text-gray-400 hover:text-white transition-colors">
                    <i class="fa-solid fa-arrow-left text-xl"></i>
                </a>
                <h1 class="text-2xl md:text-4xl font-black truncate">Streaming: Season {{ episode.season }} Episode {{ episode.episode }}</h1>
            </div>

            <div class="relative aspect-video bg-black rounded-[2rem] overflow-hidden shadow-inner border border-white/5">
                <video id="player" controls class="w-full h-full" poster="{{ logo_url }}">
                    <source src="{{ stream_url }}" type="video/mp4">
                    Your browser does not support the video tag.
                </video>
            </div>

            <div class="mt-8 flex flex-wrap items-center justify-between gap-4">
                <div class="flex items-center gap-4">
                    <span class="px-4 py-2 bg-red-600/20 text-red-500 rounded-xl font-bold border border-red-500/20">
                        {{ episode.quality }}
                    </span>
                    <span class="text-gray-400 font-medium">
                        <i class="fa-solid fa-hard-drive mr-2"></i> {{ (episode.file_size / (1024*1024))|round(2) }} MB
                    </span>
                </div>

                <a href="{{ stream_url }}" class="px-8 py-4 bg-white text-black font-black rounded-2xl hover:bg-red-600 hover:text-white transition-all flex items-center shadow-xl">
                    <i class="fa-solid fa-download mr-3 text-xl"></i> DOWNLOAD NOW
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
