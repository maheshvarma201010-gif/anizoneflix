<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Post - {{ anime.title }}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: #0f172a; color: white; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); }
        input, textarea, select { background: #1e293b !important; color: white !important; border: 1px solid #334155 !important; }
    </style>
</head>
<body class="p-4 md:p-8">
    <div class="max-w-4xl mx-auto">
        <div class="flex items-center mb-8">
            <a href="/admin/dashboard" class="mr-4 text-gray-400 hover:text-white">
                <i class="fa-solid fa-arrow-left text-2xl"></i>
            </a>
            <h1 class="text-3xl font-bold">Edit Post</h1>
        </div>

        <form id="editForm" class="space-y-6">
            <div class="glass p-6 rounded-2xl space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-400 mb-1">Title</label>
                    <input type="text" name="title" value="{{ anime.title }}" class="w-full px-4 py-2 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-400 mb-1">Synopsis</label>
                    <textarea name="synopsis" rows="6" class="w-full px-4 py-2 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">{{ anime.synopsis }}</textarea>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-400 mb-1">Image URL</label>
                        <input type="text" name="image" value="{{ anime.image }}" class="w-full px-4 py-2 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-400 mb-1">Trailer URL</label>
                        <input type="text" name="trailer" value="{{ anime.trailer }}" class="w-full px-4 py-2 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                    </div>
                </div>
            </div>

            <div class="glass p-6 rounded-2xl">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-xl font-bold">Custom Buttons</h2>
                    <button type="button" onclick="addButton()" class="px-3 py-1 bg-green-600 hover:bg-green-700 rounded-lg text-sm transition">
                        <i class="fa-solid fa-plus"></i> Add Button
                    </button>
                </div>
                <div id="buttonContainer" class="space-y-3">
                    {% if anime.custom_buttons %}
                        {% for btn in anime.custom_buttons %}
                        <div class="flex gap-2 button-row">
                            <input type="text" placeholder="Label" class="flex-1 px-4 py-2 rounded-lg" value="{{ btn.label }}">
                            <input type="text" placeholder="URL" class="flex-[2] px-4 py-2 rounded-lg" value="{{ btn.url }}">
                            <button type="button" onclick="this.parentElement.remove()" class="px-3 py-2 bg-red-600 rounded-lg hover:bg-red-700">
                                <i class="fa-solid fa-trash"></i>
                            </button>
                        </div>
                        {% endfor %}
                    {% endif %}
                </div>
            </div>

            <div class="flex justify-end gap-4">
                <button type="button" id="saveBtn" class="px-8 py-3 bg-blue-600 hover:bg-blue-700 rounded-xl font-bold transition shadow-lg shadow-blue-900/20">
                    <i class="fa-solid fa-save mr-2"></i> Save Changes
                </button>
            </div>
        </form>
    </div>

    <script>
        function addButton() {
            const container = document.getElementById('buttonContainer');
            const div = document.createElement('div');
            div.className = 'flex gap-2 button-row';
            div.innerHTML = `
                <input type="text" placeholder="Label" class="flex-1 px-4 py-2 rounded-lg">
                <input type="text" placeholder="URL" class="flex-[2] px-4 py-2 rounded-lg">
                <button type="button" onclick="this.parentElement.remove()" class="px-3 py-2 bg-red-600 rounded-lg hover:bg-red-700">
                    <i class="fa-solid fa-trash"></i>
                </button>
            `;
            container.appendChild(div);
        }

        document.getElementById('saveBtn').addEventListener('click', async () => {
            const btn = document.getElementById('saveBtn');
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-2"></i> Saving...';

            const form = document.getElementById('editForm');
            const formData = new FormData(form);
            const data = {};
            formData.forEach((value, key) => data[key] = value);

            // Collect buttons
            const buttons = [];
            document.querySelectorAll('.button-row').forEach(row => {
                const inputs = row.querySelectorAll('input');
                if (inputs[0].value && inputs[1].value) {
                    buttons.push({ label: inputs[0].value, url: inputs[1].value });
                }
            });
            data.custom_buttons = buttons;

            try {
                const res = await fetch('/api/admin/save/{{ anime.mal_id }}', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                const result = await res.json();
                if (result.status === 'success') {
                    alert('Saved successfully!');
                } else {
                    alert('Error: ' + result.error);
                }
            } catch (e) {
                alert('Request failed');
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fa-solid fa-save mr-2"></i> Save Changes';
            }
        });
    </script>
</body>
</html>
