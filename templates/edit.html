<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Post - {{ anime.title }}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --tg-theme-bg: #050505;
            --tg-accent: #e50914;
            --tg-glass: rgba(15, 15, 15, 0.7);
        }
        body { background-color: var(--tg-theme-bg); color: white; font-family: 'Inter', sans-serif; }
        .glass { background: var(--tg-glass); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.08); }
        input, textarea, select { background: rgba(255,255,255,0.05) !important; color: white !important; border: 1px solid rgba(255,255,255,0.1) !important; transition: all 0.3s; }
        input:focus, textarea:focus { border-color: var(--tg-accent) !important; background: rgba(255,255,255,0.1) !important; }
    </style>
</head>
<body class="p-4 md:p-12 selection:bg-red-500/30">
    <div class="max-w-4xl mx-auto">
        <div class="flex items-center gap-6 mb-12 animate-fade-in">
            <a href="/admin/dashboard" class="w-12 h-12 flex items-center justify-center glass rounded-xl hover:bg-white hover:text-black transition-all">
                <i class="fa-solid fa-arrow-left"></i>
            </a>
            <h1 class="text-4xl font-black tracking-tighter uppercase">Edit <span class="text-red-600">Archive</span></h1>
        </div>

        <form id="editForm" class="space-y-8 animate-fade-in" style="animation-delay: 0.1s">
            <div class="glass p-8 rounded-[2.5rem] space-y-6 shadow-2xl border border-white/5">
                <div class="flex items-center gap-3 mb-4">
                    <i class="fa-solid fa-info-circle text-red-600"></i>
                    <h2 class="text-xl font-black uppercase tracking-tight">General Metadata</h2>
                </div>

                <div>
                    <label class="block text-[10px] font-black text-gray-500 uppercase tracking-[0.2em] mb-3 ml-1">Series Title</label>
                    <input type="text" name="title" value="{{ anime.title }}" class="w-full px-6 py-4 rounded-2xl focus:ring-0 outline-none font-bold">
                </div>
                <div>
                    <label class="block text-[10px] font-black text-gray-500 uppercase tracking-[0.2em] mb-3 ml-1">Synopsis</label>
                    <textarea name="synopsis" rows="6" class="w-full px-6 py-4 rounded-2xl focus:ring-0 outline-none leading-relaxed">{{ anime.synopsis }}</textarea>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-[10px] font-black text-gray-500 uppercase tracking-[0.2em] mb-3 ml-1">Poster URL</label>
                        <input type="text" name="image" value="{{ anime.image }}" class="w-full px-6 py-4 rounded-2xl focus:ring-0 outline-none">
                    </div>
                    <div>
                        <label class="block text-[10px] font-black text-gray-500 uppercase tracking-[0.2em] mb-3 ml-1">Trailer URL</label>
                        <input type="text" name="trailer" value="{{ anime.trailer }}" class="w-full px-6 py-4 rounded-2xl focus:ring-0 outline-none">
                    </div>
                </div>
            </div>

            <div class="glass p-8 rounded-[2.5rem] shadow-2xl border border-white/5">
                <div class="flex justify-between items-center mb-8">
                    <div class="flex items-center gap-3">
                        <i class="fa-solid fa-link text-red-600"></i>
                        <h2 class="text-xl font-black uppercase tracking-tight">External Redirects</h2>
                    </div>
                    <button type="button" onclick="addButton()" class="px-5 py-2 bg-white text-black font-black rounded-xl text-[10px] uppercase tracking-widest hover:bg-red-600 hover:text-white transition-all shadow-lg">
                        <i class="fa-solid fa-plus mr-2"></i> APPEND
                    </button>
                </div>
                <div id="buttonContainer" class="space-y-4">
                    {% if anime.custom_buttons %}
                        {% for btn in anime.custom_buttons %}
                        <div class="flex flex-col md:flex-row gap-4 p-4 bg-white/5 rounded-2xl border border-white/5 button-row relative group">
                            <div class="absolute -left-2 top-1/2 -translate-y-1/2 w-1 h-8 bg-red-600 rounded-full opacity-0 group-hover:opacity-100 transition-opacity"></div>
                            <input type="text" placeholder="Label (e.g. Watch Online)" class="flex-1 px-5 py-3 rounded-xl font-bold" value="{{ btn.name }}">
                            <input type="text" placeholder="Destination URL" class="flex-[2] px-5 py-3 rounded-xl" value="{{ btn.link }}">
                            <button type="button" onclick="this.closest('.button-row').remove()" class="w-full md:w-12 h-12 flex items-center justify-center bg-red-600/20 text-red-500 rounded-xl hover:bg-red-600 hover:text-white transition-all">
                                <i class="fa-solid fa-trash-can"></i>
                            </button>
                        </div>
                        {% endfor %}
                    {% endif %}
                </div>
            </div>

            <div class="flex justify-end pt-6">
                <button type="button" id="saveBtn" class="w-full md:w-auto px-12 py-5 bg-red-600 hover:bg-red-700 text-white font-black rounded-2xl transition-all shadow-2xl shadow-red-900/40 uppercase tracking-widest flex items-center justify-center">
                    <i class="fa-solid fa-cloud-upload-alt mr-3 text-xl"></i> COMMIT CHANGES
                </button>
            </div>
        </form>
    </div>

    <script>
        function addButton() {
            const container = document.getElementById('buttonContainer');
            const div = document.createElement('div');
            div.className = 'flex flex-col md:flex-row gap-4 p-4 bg-white/5 rounded-2xl border border-white/5 button-row animate-fade-in';
            div.innerHTML = `
                <input type="text" placeholder="Label" class="flex-1 px-5 py-3 rounded-xl font-bold">
                <input type="text" placeholder="URL" class="flex-[2] px-5 py-3 rounded-xl">
                <button type="button" onclick="this.closest('.button-row').remove()" class="w-full md:w-12 h-12 flex items-center justify-center bg-red-600/20 text-red-500 rounded-xl hover:bg-red-600 hover:text-white transition-all">
                    <i class="fa-solid fa-trash-can"></i>
                </button>
            `;
            container.appendChild(div);
        }

        document.getElementById('saveBtn').addEventListener('click', async () => {
            const btn = document.getElementById('saveBtn');
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-2"></i> Saving...';

            const form = document.getElementById('editForm');
            const formData = new FormData(form);
            const data = {};
            formData.forEach((value, key) => data[key] = value);

            // Collect buttons
            const buttons = [];
            document.querySelectorAll('.button-row').forEach(row => {
                const inputs = row.querySelectorAll('input');
                if (inputs[0].value && inputs[1].value) {
                    buttons.push({ name: inputs[0].value, link: inputs[1].value });
                }
            });
            data.custom_buttons = buttons;

            try {
                const res = await fetch('/api/admin/save/{{ anime.mal_id }}', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                const result = await res.json();
                if (result.success) {
                    alert('Saved successfully!');
                } else {
                    alert('Error: ' + result.message);
                }
            } catch (e) {
                alert('Request failed');
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fa-solid fa-save mr-2"></i> Save Changes';
            }
        });
    </script>
</body>
</html>
