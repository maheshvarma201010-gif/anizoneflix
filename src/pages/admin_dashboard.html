{% extends "base.html" %}

{% block content %}
<div class="px-6 md:px-20 pt-32 pb-20 max-w-7xl mx-auto">
    <div class="flex justify-between items-center mb-10">
        <h1 class="text-3xl font-black uppercase tracking-tighter">Admin <span class="text-red-600">Dashboard</span></h1>
        <div class="flex space-x-4">
            <a href="/search" class="bg-red-600 px-6 py-2 rounded-lg font-bold text-sm">Add Content</a>
        </div>
    </div>

    <div class="bg-zinc-900 rounded-2xl border border-white/5 overflow-hidden">
        <table class="w-full text-left">
            <thead class="bg-black/40 text-[10px] font-black uppercase tracking-widest text-gray-500">
                <tr>
                    <th class="px-6 py-4">Poster</th>
                    <th class="px-6 py-4">Title</th>
                    <th class="px-6 py-4">Type</th>
                    <th class="px-6 py-4">Year</th>
                    <th class="px-6 py-4">Actions</th>
                </tr>
            </thead>
            <tbody class="divide-y divide-white/5">
                {% for item in posts %}
                <tr class="hover:bg-white/5 transition">
                    <td class="px-6 py-4">
                        <img src="{{ item.image }}" class="w-10 h-14 object-cover rounded shadow" alt="">
                    </td>
                    <td class="px-6 py-4 font-bold text-sm">{{ item.title }}</td>
                    <td class="px-6 py-4">
                        <span class="text-[10px] font-black bg-zinc-800 px-2 py-1 rounded uppercase">{{ item.type }}</span>
                    </td>
                    <td class="px-6 py-4 text-gray-400 text-sm">{{ item.year }}</td>
                    <td class="px-6 py-4">
                        <div class="flex space-x-3">
                            <a href="/watch/{{ item.slug }}" class="text-blue-500 hover:text-blue-400"><i class="fa-solid fa-eye"></i></a>
                            <button class="text-red-600 hover:text-red-500"><i class="fa-solid fa-trash"></i></button>
                        </div>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
