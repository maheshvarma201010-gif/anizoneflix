{% extends "base.html" %}

{% block content %}
<div class="px-6 md:px-20 pt-32 pb-20 max-w-7xl mx-auto">
    <h1 class="text-4xl md:text-6xl font-black uppercase tracking-tighter mb-12 text-center">Browse <span class="text-red-600">Categories</span></h1>

    <div class="grid grid-cols-2 md:grid-cols-4 gap-6">
        {% for cat in categories %}
        <a href="/search?genre={{ cat.name }}" class="group relative aspect-video rounded-2xl overflow-hidden border border-white/10 hover:border-red-600 transition duration-500">
            <div class="absolute inset-0 bg-gradient-to-t from-black to-transparent z-10"></div>
            <div class="absolute inset-0 flex items-center justify-center z-20">
                <span class="text-xl font-black uppercase tracking-widest group-hover:scale-110 transition">{{ cat.name }}</span>
            </div>
            <img src="https://images.unsplash.com/photo-1536440136628-849c177e76a1?auto=format&fit=crop&q=80&w=400" class="w-full h-full object-cover opacity-40 group-hover:scale-110 transition duration-700" alt="">
        </a>
        {% endfor %}
    </div>
</div>
{% endblock %}
