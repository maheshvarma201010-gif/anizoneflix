{% extends "base.html" %}

{% block content %}
<div class="px-4 md:px-16 pt-24 md:pt-36 pb-20 max-w-7xl mx-auto space-y-12">
    <div class="text-center space-y-4">
        <h1 class="text-4xl md:text-6xl font-black uppercase tracking-tighter">Browse <span class="text-red-600">Categories</span></h1>
        <p class="text-gray-400 font-medium text-sm md:text-base">Filter the entire catalog by genre and find your next favorite watch.</p>
    </div>

    <div class="grid grid-cols-2 md:grid-cols-4 gap-6 pt-6">
        {% for cat in categories %}
        <a href="/search?genre={{ cat.name }}" class="group relative bg-[#0c0c0c] border border-white/5 hover:border-red-600/40 rounded-2xl p-8 flex flex-col justify-between h-40 transition duration-300 shadow-xl overflow-hidden">
            <!-- Accent glow on hover -->
            <div class="absolute -right-10 -bottom-10 w-24 h-24 bg-red-600/10 rounded-full blur-xl group-hover:bg-red-600/20 transition duration-300"></div>

            <div class="w-12 h-12 rounded-xl bg-white/5 border border-white/5 flex items-center justify-center text-red-500 group-hover:bg-red-600 group-hover:text-white transition duration-300 shadow-md">
                <i class="fa-solid fa-tags text-lg"></i>
            </div>

            <div>
                <span class="text-xs font-black text-gray-500 group-hover:text-red-500 transition duration-300 uppercase tracking-widest">Genre</span>
                <h2 class="text-lg md:text-xl font-black uppercase text-white tracking-tight mt-1">{{ cat.name }}</h2>
            </div>
        </a>
        {% else %}
        <div class="col-span-full py-16 text-center bg-white/5 rounded-2xl border border-dashed border-white/10">
            <p class="text-gray-500 font-bold">No categories/genres currently configured.</p>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
